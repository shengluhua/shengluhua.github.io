name: Validate complete EDA reader
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eda-reader-v2-qa.yml'
      - 'microcourses/eda/index.html'
      - 'microcourses/eda/publication-checkpoint.json'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all loaded lessons and graders
        id: data
        continue-on-error: true
        run: node microcourses/eda/validate-publication.cjs
      - name: Install browser harness
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser interaction and persistence tests
        id: browser
        continue-on-error: true
        run: |
          python -m http.server 8765 --directory . >/tmp/eda-v2-server.log 2>&1 &
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json
          out=Path('publication-audit');out.mkdir(exist_ok=True)
          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width,height in [(390,844),(768,1024),(1024,768)]:
                  page=browser.new_page(viewport={'width':width,'height':height},has_touch=True)
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.route('https://**/*',lambda r:r.abort())
                  base='http://127.0.0.1:8765/microcourses/eda/'
                  try:
                      page.goto(base,wait_until='networkidle')
                      page.locator('.metrics').wait_for()
                      counts=page.evaluate('({full:Object.keys(EDALessons).length,examples:EDAExamples.length,errors:EDAPublicationErrors})')
                      assert not counts['errors'],counts['errors']
                      assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                      page.screenshot(path=str(out/f'home-{width}.png'),full_page=True)
                      ids=page.evaluate('Object.keys(EDALessons)')
                      for id in ids:
                          page.goto(base+'#lesson='+id)
                          page.locator('.full-lesson').wait_for()
                          assert page.locator('.full-lesson h2').count()>=8,id
                          assert page.locator('form[data-grade="lesson:'+id+'"]').count()==1,id
                          assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1'),id
                      page.goto(base+'#example=B019')
                      form=page.locator('form[data-grade="example:B019"]')
                      assert not form.locator('[data-feedback="0"]').inner_text()
                      form.locator('[name=q0]').fill('!z | y')
                      form.locator('[name=q1]').fill('y')
                      form.locator('[name=q2]').fill('(x & !z) | y')
                      form.locator('button[type=submit]').click()
                      assert '100 / 100' in form.locator('[data-score]').inner_text()
                      page.reload(wait_until='networkidle')
                      assert page.locator('form[data-grade="example:B019"] [name=q0]').input_value()=='!z | y'
                      page.goto(base+'#example=R032')
                      form=page.locator('form[data-grade="example:R032"]')
                      for r,c in [(0,0),(0,1),(1,1),(2,1),(2,2)]:form.locator('[data-question="0"] [data-cell="'+str(r)+','+str(c)+'"]').click()
                      form.locator('[name=q1]').fill('4');form.locator('[name=q2]').fill('3')
                      form.locator('button[type=submit]').click()
                      assert '100 / 100' in form.locator('[data-score]').inner_text()
                      page.screenshot(path=str(out/f'route-{width}.png'),full_page=True)
                      page.goto(base+'#lesson=T03')
                      page.locator('[data-demo=shannon] [data-shannon-bit=a]').check()
                      page.locator('[data-demo=shannon] [data-demo-next]').click()
                      assert 'a=1' in page.locator('[data-shannon-output]').inner_text()
                      page.goto(base+'#lesson=L06')
                      for _ in range(4):page.locator('[data-demo=gemm] [data-demo-next]').click()
                      assert '= 7' in page.locator('[data-demo-result]').inner_text()
                      page.goto(base+'#lesson=T01')
                      f=page.locator('form[data-grade="lesson:T01"]')
                      f.locator('button[type=submit]').click()
                      assert '待评 40' in f.locator('[data-score]').inner_text()
                      assert '综合得分' not in f.locator('[data-score]').inner_text()
                      page.goto('http://127.0.0.1:8765/microcourses/',wait_until='networkidle')
                      page.locator('[data-eda-course]').wait_for()
                      assert page.locator('.course-grid .course-box').count()==5
                      page.locator('[data-eda-course]').click()
                      page.locator('.metrics').wait_for()
                      assert not errors,errors
                      results.append({'viewport':[width,height],'status':'PASS','counts':counts,'lessons_opened':len(ids),'checks':['no overflow','equivalent boolean answer','persisted answers','alternative optimal path','manual pending','Shannon','GEMM','five-course entrance']})
                  except Exception as e:
                      results.append({'viewport':[width,height],'status':'FAIL','error':str(e),'page_errors':errors})
                      page.screenshot(path=str(out/f'failure-{width}.png'),full_page=True)
                  page.close()
              browser.close()
          (out/'browser-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False,indent=2))
          if any(r['status']!='PASS' for r in results):raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eda-reader-v2-qa
          path: |
            publication-audit/
            microcourses/
          retention-days: 7
      - name: Require genuine test success
        if: always()
        run: |
          test '${{ steps.data.outcome }}' = 'success'
          test '${{ steps.browser.outcome }}' = 'success'
