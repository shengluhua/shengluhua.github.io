name: Complete EDA course QA
on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - 'microcourses/eda/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/eda-complete-qa.yml'
permissions:
  contents: read
concurrency:
  group: eda-complete-${{ github.ref }}
  cancel-in-progress: true
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, linked content, independent models and complete assessment bank
        run: |
          node scripts/build-eda.mjs
          git diff --exit-code microcourses/eda/index.html
          for f in microcourses/eda/*.js microcourses/assets/*.js tests/*.js; do node --check "$f"; done
          node --test tests/*.test.js
          node tests/animations-models.cjs
          node scripts/build-eda-evidence.cjs
          git diff --exit-code microcourses/eda/evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eda-content-${{ github.sha }}
          path: test-results/
          retention-days: 30
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: course, label: course}
          - {suite: assessment, label: assessment}
          - {suite: animations, label: animations-phone, viewport: 390x844}
          - {suite: animations, label: animations-tablet, viewport: 768x1024}
          - {suite: animations, label: animations-desktop, viewport: 1024x768}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test tooling
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Start local static preview
        run: |
          python -m http.server 8765 --directory . >/tmp/eda-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/microcourses/eda/ >/dev/null && break; sleep 1; done
      - name: Real Chromium content, grading and animation controls
        env:
          EDA_ANIMATION_VIEWPORT: ${{ matrix.viewport || '' }}
        run: python tests/${{ matrix.suite }}-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eda-browser-${{ matrix.label }}-${{ github.sha }}
          path: test-results/
          retention-days: 30

  deployed:
    if: github.ref == 'refs/heads/main'
    needs: [content, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser for public acceptance
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Wait for this exact public asset set, then check all public course routes
        env:
          BASE_URL: https://shengluhua.github.io/microcourses/eda/
        run: |
          python tests/wait-deployment.py
          python tests/course-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eda-public-${{ github.sha }}
          path: test-results/
          retention-days: 30
